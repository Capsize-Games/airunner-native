name: Native Sidecar Input Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          for script in scripts/build_runtime_sidecars.sh scripts/package_runtime_sidecars.sh scripts/upload_native_release_assets.sh; do
            bash -n "$script"
          done

      - name: Run sidecar safety and packaging tests
        run: python3 -m unittest discover -s tests -v
