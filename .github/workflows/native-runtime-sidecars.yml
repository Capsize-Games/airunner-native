name: Native Runtime Sidecars

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-sidecars:
    runs-on: ubuntu-latest
    # write is only needed to attach release assets in the last step
    # below (and only fires on an actual release event); read would be
    # enough for everything else this job does.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        target-platform:
          - linux
          - windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64 ninja-build

      - name: Build pinned sidecar bundle
        run: |
          ./scripts/build_runtime_sidecars.sh \
            --clean \
            --target-platform ${{ matrix.target-platform }}

      - name: Package sidecar bundle and provenance
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./scripts/package_runtime_sidecars.sh "${{ matrix.target-platform }}"

      - name: Upload sidecar bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-sidecars-${{ matrix.target-platform }}
          if-no-files-found: error
          path: |
            runtime-sidecars-${{ matrix.target-platform }}.tar.gz
            runtime-sidecars-${{ matrix.target-platform }}.tar.gz.sha256
            runtime-sidecars-${{ matrix.target-platform }}-provenance.txt

      # The upload helper verifies the exact local and remote annotated tag
      # objects, peeled source SHA, checkout SHA, and every asset name before it
      # performs one no-clobber upload operation.
      - name: Preflight and attach release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ./scripts/upload_native_release_assets.sh \
            "$GITHUB_REF_NAME" \
            "runtime-sidecars-${{ matrix.target-platform }}.tar.gz" \
            "runtime-sidecars-${{ matrix.target-platform }}.tar.gz.sha256" \
            "runtime-sidecars-${{ matrix.target-platform }}-provenance.txt"
